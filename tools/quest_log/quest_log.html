/* Layout: a single dark Grim-UI plate stack. Top bar (level + XP + sound), tab rail, one view at a time.
   The Journey view draws the phases as a vertical shaft you descend. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --void: #0b0c10;      /* page ground: the dark below the blocks */
  --plate: #15161c;     /* panel plate */
  --plate-2: #1d1f27;   /* raised plate / hover */
  --rivet: #33363f;     /* plate edge */
  --steel: #737885;     /* corner brackets, dim text */
  --bone: #ddd3bd;      /* body text */
  --bone-dim: #a39b89;
  --gold: #e7b14a;      /* accent: XP, active, the pack's gold tag */
  --ember: #d6812d;
  --blood: #c25050;
  --green: #4e9f4c;
  --blue: #5c72d6;
  --purple: #af50c2;
  --display: "m5x7", ui-monospace, monospace;
  --body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--void); color: var(--bone); font-family: var(--body); font-size: 17px; line-height: 1.45; }
.px { font-family: var(--display); font-size: 32px; line-height: 0.9; letter-spacing: 0.5px; -webkit-font-smoothing: none; font-smooth: never; font-weight: normal; }
.px-lg { font-size: 64px; line-height: 0.85; }
.dim { color: var(--bone-dim); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Grim plate: dark fill, rivet edge, steel corner brackets drawn with gradients */
.plate {
  position: relative; background-color: var(--plate); border: 2px solid var(--rivet);
  background-image:
    linear-gradient(var(--steel), var(--steel)), linear-gradient(var(--steel), var(--steel)),
    linear-gradient(var(--steel), var(--steel)), linear-gradient(var(--steel), var(--steel)),
    linear-gradient(var(--steel), var(--steel)), linear-gradient(var(--steel), var(--steel)),
    linear-gradient(var(--steel), var(--steel)), linear-gradient(var(--steel), var(--steel));
  background-size: 10px 2px, 2px 10px, 10px 2px, 2px 10px, 10px 2px, 2px 10px, 10px 2px, 2px 10px;
  background-position: 3px 3px, 3px 3px, calc(100% - 3px) 3px, calc(100% - 3px) 3px,
    3px calc(100% - 3px), 3px calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) calc(100% - 3px);
  background-repeat: no-repeat;
  box-shadow: inset 0 0 0 1px #0006, 0 3px 0 #0008;
  padding: 18px;
}
.plate.hero { border-color: #4a4433; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 14px 8px;
  background: var(--plate-2); border: 2px solid var(--rivet); border-bottom-width: 4px;
  font-family: var(--display); font-size: 32px; line-height: 0.8; -webkit-font-smoothing: none;
}
.btn:hover { border-color: var(--steel); }
.btn:active { border-bottom-width: 2px; transform: translateY(2px); }
.btn.gold { background: #3a2c10; border-color: #8a6a26; color: #ffd98a; }
.btn.gold:hover { border-color: var(--gold); }
.btn.small { font-size: 32px; padding: 3px 10px 5px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px 10px; }
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.brand .px-lg { color: var(--gold); }
.lvl { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lvl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bar { height: 12px; background: #0a0a0d; border: 2px solid var(--rivet); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #8a5a14, var(--gold)); }
.bar.thin { height: 8px; border-width: 1px; }
.bar.green > i { background: linear-gradient(90deg, #2c5e2b, var(--green)); }
.sound { display: flex; align-items: center; gap: 8px; }
.sound input[type=range] { width: 90px; accent-color: var(--gold); }
.streak { display: flex; align-items: baseline; gap: 6px; }
.streak b { color: var(--ember); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 8px 18px; border-bottom: 2px solid var(--rivet); }
.tab { cursor: pointer; background: transparent; border: 2px solid transparent; border-bottom: none; padding: 6px 14px 4px; color: var(--bone-dim); }
.tab[aria-selected=true] { color: var(--gold); background: var(--plate); border-color: var(--rivet); margin-bottom: -2px; padding-bottom: 6px; }
.banner { border: 2px dashed var(--ember); color: #f2c08a; padding: 8px 12px; margin-bottom: 14px; font-size: 15px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 3px; border: 1px solid var(--rivet); background: #101116; font-family: var(--display); font-size: 32px; line-height: .75; -webkit-font-smoothing: none; color: var(--bone-dim); white-space: nowrap; }
.chip.who-you { color: #ffd98a; border-color: #6e5420; }
.chip.who-claude { color: #b7c3ff; border-color: #34407a; }
.chip.who-both { color: #e2b7ee; border-color: #5d3168; }
.chip.sz-s { color: #8fd18d; } .chip.sz-m { color: #9fb0ff; } .chip.sz-l { color: #e09cf0; }
.chip.st-ready { color: var(--gold); border-color: #6e5420; }
.chip.st-blocked { color: var(--steel); }
.chip.st-done { color: #8fd18d; border-color: #2c5e2b; }
.chip.st-active { color: #ffd98a; background: #3a2c10; border-color: #8a6a26; }
.moodbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
.mood { cursor: pointer; }
.mood[aria-pressed=true] { color: var(--void); background: var(--gold); border-color: var(--gold); }

/* Quest board */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--display); font-size: 32px; line-height: .8; color: var(--steel); -webkit-font-smoothing: none; }
.eyebrow.gold { color: var(--gold); }
.card p { margin: 0; color: var(--bone-dim); }
.card .actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.steps-mini { margin: 0; padding: 0; list-style: none; font-size: 15px; color: var(--bone-dim); }
.steps-mini li::before { content: "· "; color: var(--steel); }
.current { margin-bottom: 18px; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.current .next { color: var(--bone); }
@media (max-width: 560px) { .current { grid-template-columns: 1fr; } }
.empty { padding: 28px; text-align: center; color: var(--bone-dim); }

/* Active quest checklist */
.qhead { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; align-items: flex-start; }
.qhead h2 { margin: 4px 0 6px; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.steplist { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: start; padding: 10px 12px; border: 2px solid var(--rivet); background: #111217; }
.step.next { border-color: #8a6a26; background: #1f1a10; box-shadow: 0 0 0 1px #e7b14a33, 0 0 18px #e7b14a14; }
.step.done { opacity: .62; }
.step.done .stitle { text-decoration: line-through; text-decoration-color: #ddd3bd66; }
.check { width: 26px; height: 26px; border: 2px solid var(--steel); background: #0a0a0d; cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 2px; }
.check[aria-checked=true] { background: #2c5e2b; border-color: var(--green); }
.check[aria-checked=true]::after { content: ""; width: 10px; height: 5px; border: solid #d9f5d6; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.stitle { min-width: 0; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.sid { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--steel); }
.snote { font-size: 14px; color: var(--ember); margin-top: 3px; }
.step .tools { display: flex; gap: 6px; align-items: center; }
.reads { font-size: 14px; color: var(--bone-dim); margin-top: 12px; }
.reads code { font-size: 12.5px; color: var(--bone-dim); background: #0e0f13; padding: 0 4px; }

/* Journey: the descent shaft */
.journey { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .journey { grid-template-columns: 1fr; } }
.big { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.big .pct { font-family: var(--display); font-size: 128px; line-height: .7; color: var(--gold); -webkit-font-smoothing: none; }
.shaft { position: relative; display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
.stop { display: grid; grid-template-columns: 56px 1fr; gap: 14px; position: relative; padding-block: 10px; }
.stop .rail { position: relative; display: flex; justify-content: center; }
.stop .rail::before { content: ""; position: absolute; top: -10px; bottom: -10px; width: 6px; background: repeating-linear-gradient(#2a2c34 0 6px, #1b1c22 6px 12px); }
.stop:first-child .rail::before { top: 18px; }
.stop:last-child .rail::before { bottom: calc(100% - 18px); }
.stop .node { position: relative; z-index: 1; width: 40px; height: 40px; border: 2px solid var(--rivet); background: var(--plate); display: grid; place-items: center; font-family: var(--display); font-size: 32px; line-height: 1; -webkit-font-smoothing: none; color: var(--steel); }
.stop.cleared .node { border-color: var(--green); color: #8fd18d; }
.stop.here .node { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 16px #e7b14a55; }
.stop .body { min-width: 0; padding: 10px 14px; border: 2px solid var(--rivet); background: var(--plate); }
.stop.here .body { border-color: #8a6a26; }
.stop .body .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stop .body small { color: var(--bone-dim); font-size: 14px; }
.tracks { display: flex; flex-direction: column; gap: 10px; }
.trk .row { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.behind { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.behind li { display: contents; }
.behind span:last-child { color: #8fd18d; font-variant-numeric: tabular-nums; text-align: right; }
.sec + .sec { margin-top: 16px; }
.sec h4 { margin: 0 0 10px; }

/* Quest book */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { background: #0e0f13; border: 2px solid var(--rivet); padding: 6px 10px; min-width: 0; }
.filters input { flex: 1 1 220px; }

const PHASE_IDX = Object.fromEntries(PHASES.map((p, i) => [p.id, i]));
const LIVE = TASKS.filter(t => !t.cut);
const BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));
const STEP_TASK = {};
for (const t of TASKS) for (const s of t.steps) STEP_TASK[s[0]] = t;
const ALL_STEPS = LIVE.flatMap(t => t.steps);
const TOTAL_XP = ALL_STEPS.reduce((a, s) => a + XP[s[3]], 0);
const LEVEL_AT = LEVEL_TITLES.map((_, i) => Math.round(TOTAL_XP * Math.pow(i / (LEVEL_TITLES.length - 1), 1.5)));
const phaseOf = t => t.side ? t.earliest : t.phase;
const MAIN = LIVE.filter(t => !t.side);
const SIDE = LIVE.filter(t => t.side);

const isDone = id => { const d = S.done[id]; return !!(d && d.at); };
const taskStepsDone = t => t.steps.filter(s => isDone(s[0])).length;
const taskDone = t => t.steps.every(s => isDone(s[0]));
const unmet = t => (t.needs || []).filter(n => BY_ID[n] && !BY_ID[n].cut && !taskDone(BY_ID[n]));
const earnedXP = () => ALL_STEPS.reduce((a, s) => a + (isDone(s[0]) ? XP[s[3]] : 0), 0);
function levelFor(xp) { let l = 0; for (let i = 0; i < LEVEL_AT.length; i++) if (xp >= LEVEL_AT[i]) l = i; return l; }
function currentPhaseIdx() {
  for (let i = 0; i < PHASES.length; i++) if (MAIN.some(t => t.phase === PHASES[i].id && !taskDone(t))) return i;
  return PHASES.length - 1;
}
function status(t) {
  if (taskDone(t)) return "done";
  if (S.active === t.id) return "active";
  if (unmet(t).length) return "blocked";
  if (t.side && PHASE_IDX[t.earliest] > currentPhaseIdx()) return "later";
  return "ready";
}

function chainOf(t) {   // unfinished prerequisites, deepest first
  const out = [], seen = new Set();
  (function visit(x) { for (const n of unmet(x)) { if (seen.has(n)) continue; seen.add(n); visit(BY_ID[n]); out.push(BY_ID[n]); } })(t);
  return out;
}
const unlocksOf = t => LIVE.filter(x => (x.needs || []).includes(t.id));
const nextStep = t => t.steps.find(s => !isDone(s[0]));

// ── persistence ──────────────────────────────────────────────────────────────────────────
function saveLocal() { try { localStorage.setItem(LS_PROGRESS, JSON.stringify(S)); } catch (e) {} }
function savePrefs() { try { localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); } catch (e) {} }
try { const c = JSON.parse(localStorage.getItem(LS_PROGRESS) || "null"); if (c && c.done) S = Object.assign(S, c); } catch (e) {}

const queues = {};
function writeDoc(path, patch) {
  saveLocal();
  if (store !== "db") return;
  queues[path] = (queues[path] || Promise.resolve()).then(async () => {
    const ref = db.doc(path);
    try { await ref.update(patch); }
    catch (e) {
      if (e && e.code === "invalid_argument") { const snap = await ref.get(); if (!snap.exists) { await ref.set(patch); return; } }
      throw e;
    }
  }).catch(e => toast("Couldn't save that change: " + ((e && e.message) || "the store refused it") + ". It's kept in this browser."));
}

let localWrites = new Set();
async function initStore() {
  let api = null;
  try { api = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { api = null; }
  if (!api) { store = "local"; renderBanner(); render(); return; }
  db = api; store = "db"; renderBanner();
  let first = true;
  db.doc("progress/steps").onSnapshot(snap => {
    const incoming = (snap.exists && snap.data().done) || {};
    const before = S.done;
    S.done = JSON.parse(JSON.stringify(incoming));
    if (!first) {
      for (const id of Object.keys(S.done)) {
        if (S.done[id] && S.done[id].at && !(before[id] && before[id].at) && !localWrites.has(id)) {
          const t = STEP_TASK[id]; const s = t && t.steps.find(x => x[0] === id);
          if (s) toast((S.done[id].by === "claude" ? "Claude ticked off: " : "Ticked off: ") + s[1]);
          if (t && taskDone(t)) celebrate(t, true);
        }
      }
    } else if (!snap.exists && Object.keys(before).length) {
      // first visit with db: carry this browser's progress into the store
      S.done = before; writeDoc("progress/steps", { done: before });
    }
    first = false; localWrites.clear(); saveLocal(); render();
  }, e => { toast("Lost the live connection to the progress store."); });
  db.doc("progress/state").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    S.active = d.active || null; S.started = Object.assign({}, d.started || {});
    saveLocal(); render();
  }, () => {});
}

function renderBanner() {
  const b = document.getElementById("banner");
  if (store === "local") b.innerHTML = '<div class="banner">Progress is saving to this browser only (the shared store isn\'t available in this view). Use Trophies → Backup to move it.</div>';
  else b.innerHTML = "";
}

// ── actions ──────────────────────────────────────────────────────────────────────────────
function setStep(id, on) {
  const t = STEP_TASK[id]; if (!t) return;
  const xpBefore = earnedXP(), lvBefore = levelFor(xpBefore), badgesBefore = earnedBadges();
  const wasDone = taskDone(t);
  if (on) S.done[id] = { at: new Date().toISOString(), by: "ben" }; else delete S.done[id];
  localWrites.add(id);
  writeDoc("progress/steps", { done: { [id]: on ? S.done[id] : null } });
  if (on && S.active !== t.id && !taskDone(t)) takeQuest(t.id, true);
  render();
  if (on) {
    sfx("tick");
    if (!wasDone && taskDone(t)) celebrate(t, false);
    const lv = levelFor(earnedXP());
    if (lv > lvBefore) setTimeout(() => { sfx("level"); toast("Level up: " + LEVEL_TITLES[lv]); }, 700);
    const fresh = earnedBadges().filter(b => !badgesBefore.includes(b));
    fresh.forEach((b, i) => setTimeout(() => { sfx("badge"); toast("Badge earned: " + BADGES.find(x => x.id === b).name); }, 1100 + i * 500));
  }
}
function takeQuest(id, quiet) {
  S.active = id;
  if (!S.started[id]) S.started[id] = new Date().toISOString();
  writeDoc("progress/state", { active: id, started: { [id]: S.started[id] } });
  if (!quiet) { sfx("take"); view = "active"; prefs.view = view; savePrefs(); }
  render();
}
function dropQuest() { S.active = null; writeDoc("progress/state", { active: null }); render(); }

// ── kickoff messages ─────────────────────────────────────────────────────────────────────
function kickoff(t, s) {
  const ph = PHASES[PHASE_IDX[phaseOf(t)]];
  const where = t.side ? "Side quest (from phase " + ph.depth + ", " + ph.name + ")" : "Phase " + ph.depth + " · " + ph.name;
  const lines = [];
  lines.push("Quest log kickoff — Extraction Survivors (E:\\Projects\\extraction-survivors)");
  lines.push("Quest: " + t.title + " [" + t.id + "]");
  if (s) lines.push("Step: " + s[0] + " — " + s[1] + " (" + WHO_WORD[s[2]] + ", " + SIZE_LABEL[s[3]] + ")");
  lines.push(where + " · Mode: " + t.mode);
  lines.push("");
  lines.push("Context: " + t.brief);
  if (s && s[4]) lines.push("Note: " + s[4]);
  lines.push("");
  lines.push("Steps in this quest:");
  for (const x of t.steps) lines.push("  [" + (isDone(x[0]) ? "x" : " ") + "] " + x[0] + " — " + x[1] + " (" + WHO_LABEL[x[2]].toLowerCase() + ")" + (s && x[0] === s[0] ? "   <- this one" : ""));
  const blockers = chainOf(t);
  if (blockers.length) { lines.push(""); lines.push("Unfinished prerequisites (we're starting anyway): " + blockers.map(b => b.title + " [" + b.id + "]").join(", ")); }
  if (t.read && t.read.length) { lines.push(""); lines.push("Read first: CLAUDE.md, " + t.read.join(", ")); }
  lines.push("");
  const url = ARTIFACT_URL.startsWith("http") ? ARTIFACT_URL : "the Descent Quest Log artifact (see memory: reference_quest_log)";
  const ids = s ? [s[0]] : t.steps.filter(x => !isDone(x[0])).map(x => x[0]);
  lines.push((s ? "When this step is done" : "As each step is done") + ", tick it off in the quest log at " + url + ": ArtifactData \"get\" collection \"progress\" doc_id \"steps\" to read its version, then \"update\" the same doc with if_version and data {\"done\":{\"" + ids[0] + "\":{\"at\":\"<ISO time now>\",\"by\":\"claude\"}}}" + (ids.length > 1 ? " (one key per finished step id)." : "."));
  return lines.join("\n");
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast("Copied " + what + ". Paste it into a new chat with Claude."); sfx("tick"); }
  catch (e) {
    openModal('<div class="plate modal"><div class="px" style="margin-bottom:8px">COPY THIS</div><p class="dim" style="margin:0 0 8px;font-size:15px">Your browser blocked the clipboard. Select all and copy:</p><textarea class="copyfall" id="cf" readonly></textarea><div style="margin-top:10px"><button class="btn small" data-close>CLOSE</button></div></div>');
    const ta = document.getElementById("cf"); ta.value = text; ta.focus(); ta.select();
  }
}

// ── badges ───────────────────────────────────────────────────────────────────────────────
const doneDays = () => { const d = new Set(); for (const k in S.done) if (S.done[k] && S.done[k].at) d.add(dayKey(new Date(S.done[k].at))); return d; };
function dayKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function streak() {
  const days = doneDays(); let n = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function renderTop() {
  const xp = earnedXP(), lv = levelFor(xp), top = LEVEL_TITLES.length - 1;
  const floor = LEVEL_AT[lv], ceil = lv < top ? LEVEL_AT[lv + 1] : TOTAL_XP;

function picks() {
  const cur = currentPhaseIdx();
  const ready = LIVE.filter(t => status(t) === "ready" && (!mood || t.mode === mood));
  const road = ready.filter(t => !t.side).sort((a, b) => PHASE_IDX[a.phase] - PHASE_IDX[b.phase] || MAIN.indexOf(a) - MAIN.indexOf(b));
  const main = road.length ? road[shuffle % road.length] : null;
  let pool = ready.filter(t => t !== main && (mood || !main || t.mode !== main.mode));
  if (!pool.length) pool = ready.filter(t => t !== main);
  pool.sort((a, b) => (b.side ? 1 : 0) - (a.side ? 1 : 0) || PHASE_IDX[phaseOf(a)] - PHASE_IDX[phaseOf(b)]);
  const side = pool.length ? pool[shuffle % pool.length] : null;
  return { main, side, more: road.length > 1 || pool.length > 1, cur };
}

    '<div class="qlist">' + (rows.length ? rows.map(t => '<button class="qrow" data-open="' + t.id + '">' + stChip(t) +
      '<span class="t"><b>' + esc(t.title) + '</b><div class="m">' + esc(phaseLabel(t)) + " · " + esc(t.mode) + " · " + esc(TRACKS[t.track]) + "</div></span>" +
      '<span class="n">' + taskStepsDone(t) + "/" + t.steps.length + "</span></button>").join("") : '<div class="plate empty">No quests match those filters.</div>') + "</div>";
}

function viewTrophies() {
  const xp = earnedXP(), lv = levelFor(xp);
  const got = earnedBadges();
  // calendar: last 26 weeks ending this week
  const counts = {};
  for (const k in S.done) if (S.done[k] && S.done[k].at) { const dk = dayKey(new Date(S.done[k].at)); counts[dk] = (counts[dk] || 0) + 1; }
  const today = new Date(); const start = new Date(today); start.setDate(start.getDate() - (25 * 7 + today.getDay()));
  let cells = ""; const tk = dayKey(today);
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d), c = counts[k] || 0, l = c === 0 ? "" : c < 2 ? "l1" : c < 4 ? "l2" : c < 7 ? "l3" : "l4";
    cells += '<i class="' + l + (k === tk ? " today" : "") + '" title="' + k + ": " + c + ' steps"></i>';
  }
  const chron = Object.entries(S.done).filter(([, d]) => d && d.at).sort((a, b) => b[1].at.localeCompare(a[1].at)).slice(0, 60).map(([id, d]) => {
    const t = STEP_TASK[id]; const s = t && t.steps.find(x => x[0] === id); if (!s) return "";
    return '<li><time>' + new Date(d.at).toLocaleDateString() + "</time><span>" + esc(s[1]) + ' <span class="dim">— ' + esc(t.title) + (d.by === "claude" ? " · Claude" : "") + "</span></span></li>";
  }).join("");
  return '<div class="journey"><div>' +
    '<section class="plate sec"><h4 class="px">BADGES · ' + got.length + " / " + BADGES.length + '</h4><div class="badges">' + BADGES.map(b => '<div class="badge' + (got.includes(b.id) ? " got" : "") + '"><div class="sig"><span>' + esc(b.sig) + "</span></div><b>" + esc(b.name) + "</b><small>" + esc(b.hint) + "</small></div>").join("") + "</div></section>" +
    '<section class="plate sec"><h4 class="px">DAYS IN THE DEEP · ' + doneDays().size + '</h4><div class="cal-wrap"><div class="cal">' + cells + '</div></div><p class="dim" style="font-size:13px;margin:8px 0 0">Last 26 weeks. Brighter = more steps that day.</p></section>' +
    '<section class="plate sec"><h4 class="px">CHRONICLE</h4>' + (chron ? '<ol class="chron">' + chron + "</ol>" : '<p class="dim" style="margin:0">Finished steps land here, newest first, including the ones Claude ticks off.</p>') + "</section>" +
    '</div><div><section class="plate sec"><h4 class="px">THE LADDER</h4><ol class="ladder">' + LEVEL_TITLES.map((n, i) => '<li class="' + (i === lv ? "cur" : i < lv ? "got" : "") + '"><span>' + (i + 1) + ". " + esc(n) + '</span><span class="x">' + LEVEL_AT[i] + " XP</span></li>").join("") + '</ol><p class="dim" style="font-size:13px;margin:8px 0 0">The last title lands on the last box. One sitting = 10 XP, a few sittings = 25, big = 60.</p></section>' +
    '<section class="plate sec"><h4 class="px">BACKUP</h4><p class="dim" style="font-size:14px;margin:0 0 10px">Saving to: ' + (store === "db" ? "the shared store (any device, and Claude can read it)." : store === "local" ? "this browser only." : "connecting…") + '</p><div class="backup"><button class="btn small" id="exp">COPY PROGRESS</button><button class="btn small" id="imp">IMPORT</button></div></section></div></div>';
}

function render() {
  renderTop();
  const v = document.getElementById("view");
  v.innerHTML = view === "active" ? viewActive() : view === "journey" ? viewJourney() : view === "book" ? viewBook() : view === "trophies" ? viewTrophies() : viewBoard();
  if (openTask) renderDetail();
}

// ── detail modal ─────────────────────────────────────────────────────────────────────────
function openModal(html) { document.getElementById("modalRoot").innerHTML = '<div class="veil" id="veil">' + html + "</div>"; }
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; openTask = null; }
function renderDetail() {
  const t = BY_ID[openTask]; if (!t) return;
  const ch = chainOf(t), un = unlocksOf(t), st = status(t);
  const n = nextStep(t);
  openModal('<div class="plate modal" role="dialog" aria-label="' + esc(t.title) + '">' +
    '<div class="qhead"><div style="min-width:0;flex:1 1 300px"><div class="eyebrow">' + esc(phaseLabel(t).toUpperCase()) + "</div><h2 style=\"margin:4px 0 6px;font-size:24px\">" + esc(t.title) + '</h2><div class="chips">' + stChip(t) + chip("", t.mode.toUpperCase()) + chip("", TRACKS[t.track].toUpperCase()) + "</div></div>" +
    '<button class="btn small ghost" data-close aria-label="Close">CLOSE</button></div>' +
    '<p style="color:var(--bone-dim)">' + esc(t.brief) + "</p>" +
    (ch.length ? '<div class="sec"><div class="eyebrow">FINISH FIRST, IN THIS ORDER</div><ol class="chain">' + ch.map(b => '<li>' + stChip(b) + '<button class="linkish" data-open="' + b.id + '">' + esc(b.title) + "</button></li>").join("") + "</ol></div>" : "") +
    (un.length ? '<div class="sec"><div class="eyebrow">FINISHING THIS OPENS</div><ol class="chain">' + un.map(b => '<li>' + stChip(b) + '<button class="linkish" data-open="' + b.id + '">' + esc(b.title) + "</button></li>").join("") + "</ol></div>" : "") +
    '<ol class="steplist">' + t.steps.map(s => stepRow(t, s, n && s[0] === n[0] && S.active === t.id)).join("") + "</ol>" +
    '<div class="chips" style="margin-top:14px">' +
    (st === "done" ? "" : S.active === t.id ? '<button class="btn gold" data-view="active" data-close>GO TO ACTIVE QUEST</button>' :
      '<button class="btn gold" data-take="' + t.id + '">' + (st === "ready" ? "TAKE THIS QUEST" : "START IT ANYWAY") + "</button>") +
    '<button class="btn" data-kick="' + t.id + '">COPY QUEST KICKOFF</button></div></div>');
}

// ── celebration + sound ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  const box = document.getElementById("toasts"); box.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function celebrate(t, byClaude) {
  sfx("quest");
  embers();
  const un = unlocksOf(t).filter(x => status(x) === "ready");
  const xp = t.steps.reduce((a, s) => a + XP[s[3]], 0);
  openTask = null;
  openModal('<div class="plate hero modal celebrate"><div class="eyebrow gold">' + (byClaude ? "CLAUDE FINISHED IT" : "QUEST COMPLETE") + '</div><div class="px-lg px">' + esc(t.title.toUpperCase()) + '</div><div class="chips">' + chip("st-ready", "+" + xp + " XP") + chip("", phaseLabel(t).toUpperCase()) + "</div>" +
    (un.length ? '<p class="dim" style="margin:0">New paths open: ' + un.map(x => esc(x.title)).join(", ") + "</p>" : "") +
    '<div class="chips"><button class="btn gold" data-view="board" data-close>PICK THE NEXT QUEST</button><button class="btn ghost" data-close>STAY HERE</button></div></div>');
  if (S.active === t.id) dropQuest();
}
let actx = null;
function sfx(kind) {
  if (prefs.muted || !prefs.vol) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const v = prefs.vol / 100 * 0.12, t0 = actx.currentTime;
    const note = (f, at, dur, type) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(v, t0 + at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
      o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
    };
    if (kind === "tick") { note(660, 0, 0.07); note(990, 0.05, 0.09); }
    else if (kind === "take") { note(392, 0, 0.1, "triangle"); note(523, 0.08, 0.14, "triangle"); }
    else if (kind === "quest") { [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.09, 0.22)); note(1047, 0.42, 0.5, "triangle"); }
    else if (kind === "level") { [392, 494, 587, 784].forEach(f => note(f, 0, 0.7, "triangle")); note(1175, 0.18, 0.5); }
    else if (kind === "badge") { note(1319, 0, 0.12, "triangle"); note(1760, 0.1, 0.25, "triangle"); }
  } catch (e) {}
}
function embers() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("embers"), g = c.getContext("2d");
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const ps = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: c.height + Math.random() * 80, vy: 1.5 + Math.random() * 3.5, vx: (Math.random() - .5) * 1.2, s: 2 + Math.floor(Math.random() * 3), life: 0, col: Math.random() < .6 ? "#e7b14a" : "#d6812d" }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.y -= p.vy; p.x += p.vx + Math.sin((f + p.x) / 20) * .4; g.globalAlpha = Math.max(0, 1 - f / 150); g.fillStyle = p.col; g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
    if (++f < 150) requestAnimationFrame(tick); else { c.hidden = true; }
  })();
}

// ── events ───────────────────────────────────────────────────────────────────────────────
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-close], .veil"); if (!el) return;
  if (el.id === "veil" && e.target === el) { closeModal(); return; }
  const d = el.dataset;
  if (d.step) { setStep(d.step, !isDone(d.step)); return; }
  if (d.take) { closeModal(); takeQuest(d.take); return; }
  if (d.kick) { copyText(kickoff(BY_ID[d.kick]), "the quest kickoff"); return; }
  if (d.kicks) { const t = STEP_TASK[d.kicks]; copyText(kickoff(t, t.steps.find(s => s[0] === d.kicks)), "the step kickoff"); return; }
  if (d.open) { openTask = d.open; renderDetail(); return; }
  if (d.mood !== undefined) { mood = d.mood; shuffle = 0; render(); return; }
  if (d.view) { view = d.view; prefs.view = view; savePrefs(); if (d.close !== undefined) closeModal(); render(); window.scrollTo(0, 0); return; }
  if (d.v) { view = d.v; prefs.view = view; savePrefs(); render(); return; }
  if (d.close !== undefined) { closeModal(); return; }
  if (el.id === "others") { shuffle++; sfx("tick"); render(); return; }
  if (el.id === "drop") { dropQuest(); view = "board"; render(); return; }
  if (el.id === "muteBtn") { prefs.muted = !prefs.muted; savePrefs(); renderTop(); if (!prefs.muted) sfx("tick"); return; }
  if (el.id === "exp") { copyText(JSON.stringify({ questlog: 1, done: S.done, active: S.active, started: S.started }), "your progress"); return; }
  if (el.id === "imp") {
    openModal('<div class="plate modal"><div class="px" style="margin-bottom:8px">IMPORT PROGRESS</div><p class="dim" style="font-size:15px;margin:0 0 8px">Paste a copied progress block. Steps it marks done are added; nothing is removed.</p><textarea class="copyfall" id="impText"></textarea><div class="chips" style="margin-top:10px"><button class="btn gold" id="impGo">IMPORT</button><button class="btn ghost" data-close>CANCEL</button></div></div>');
    return;
  }
  if (el.id === "impGo") {
    try {
      const d2 = JSON.parse(document.getElementById("impText").value);
      const add = {}; for (const [k, v] of Object.entries(d2.done || {})) if (STEP_TASK[k] && v && v.at && !isDone(k)) { add[k] = v; S.done[k] = v; }
      if (Object.keys(add).length) writeDoc("progress/steps", { done: add });
      closeModal(); toast("Imported " + Object.keys(add).length + " steps."); render();
    } catch (err) { toast("That isn't a progress block. Copy it with COPY PROGRESS and paste it whole."); }
    return;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "vol") { prefs.vol = +e.target.value; savePrefs(); return; }
  if (e.target.id === "bq") { bookQ = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("bq"); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.id === "vol") { sfx("tick"); return; }
  if (e.target.id === "bp") { bookPhase = e.target.value; render(); }
  if (e.target.id === "bt") { bookTrack = e.target.value; render(); }
  if (e.target.id === "bs") { bookStatus = e.target.value; render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("veil")) closeModal(); });

render();
initStore();
</script>
